appId: com.tournoi.exportscene
productName: RVE
directories:
  output: release-clean
  buildResources: build-resources

asar: false
npmRebuild: false

files:
  - out/**/*
  - package.json

extraResources:
  - from: ../remotion-template
    to: remotion-template
    filter:
      - '**/*'
      - '!node_modules'
      - '!out'
      - '!build'
  - from: release-deps/node_modules
    to: node_modules
  - from: build-resources/icon.png
    to: icon.png

extraFiles:
  - from: ../assets
    to: assets

publish:
  provider: github
  owner: Alqre
  repo: RVE

win:
  target: nsis
  artifactName: '${productName}-Setup-${version}.${ext}'

nsis:
  oneClick: true
